<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!--
      Sem maximum-scale/user-scalable=no de propósito: isso deixa o
      navegador reconhecer o tamanho de texto/zoom que o usuário definiu
      no SO ou no próprio navegador, em vez de travar a página num
      tamanho fixo. O CSS (src/index.css) usa rem/em a partir daí.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Faz o font-size inicial do <html> acompanhar o ajuste de tamanho de
      texto do SO/navegador do usuário (não só o zoom do navegador). Como
      o app já usa rem/em em toda a tipografia, isso é seguro. Proposta
      recente do CSSWG, disponível no Chrome Canary; content="legacy" é
      o comportamento padrão (ignorado) em navegadores sem suporte ainda.
      https://drafts.csswg.org/css-env-1/explainers/meta-text-scale.html
    -->
    <meta name="text-scale" content="scale" />
    <meta name="theme-color" content="#100D0A" />
    <meta name="description" content="Nova — filmes e séries para assistir quando quiser." />

    <!-- OG:START -->
    <link rel="canonical" href="https://amarildo-correa.github.io/claude-code/" />
    <meta property="og:type" content="website" />

    <meta name="twitter:title" content="Nova — filmes e séries" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500;0,600;0,700;1,500&family=Roboto:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Nova — filmes e séries</title>
    <script>
      // Contraparte do redirecionamento em public/404.html: restaura a rota
      // original (ex.: /titulo/rota-42) antes do app montar, sem recarregar.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, "", l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
